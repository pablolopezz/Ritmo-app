name: Publicar Ritmo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The web build/tests use Node built-ins only; no native packages required.
      - name: Comprobar código
        run: npm run check
      - name: Ejecutar pruebas
        run: npm test
      - name: Preparar modo sin conexión
        run: npm run build:offline
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
